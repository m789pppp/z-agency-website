name: Deploy to Vercel
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Install Vercel CLI
        run: pnpm add -g vercel
        
      - name: Deploy to Vercel
        run: |
          OUTPUT=$(vercel deploy --prod \
            --token=$VERCEL_TOKEN \
            --yes \
            --name=z-agency-website 2>&1)
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "Deployed to: $DEPLOY_URL"
          
      - name: Save URL to repo file
        run: |
          echo "$DEPLOY_URL" > LIVE_URL.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LIVE_URL.txt
          git diff --staged --quiet || git commit -m "chore: save live URL [skip ci]"
          git push origin main
