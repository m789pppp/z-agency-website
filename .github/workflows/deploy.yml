name: Deploy to Vercel
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Install Vercel CLI
        run: pnpm add -g vercel
        
      - name: Deploy to Vercel
        run: |
          echo "🚀 Starting deployment..."
          OUTPUT=$(vercel deploy --prod \
            --token=$VERCEL_TOKEN \
            --yes \
            --name=z-agency-website 2>&1)
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep "https://" | grep "vercel.app" | tail -1)
          echo ""
          echo "✅ DEPLOYMENT URL: $DEPLOY_URL"
          echo "$DEPLOY_URL" > /tmp/deploy_url.txt
          
      - name: Create deployment summary
        run: |
          URL=$(cat /tmp/deploy_url.txt 2>/dev/null || echo "Check Vercel dashboard")
          echo "## 🚀 Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ✅ Live" >> $GITHUB_STEP_SUMMARY
