name: Deploy to Vercel
on:
  push:
    branches: [main]

permissions:
  contents: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install
        
      - name: Install Vercel CLI
        run: pnpm add -g vercel
        
      - name: Deploy to Vercel
        run: |
          OUTPUT=$(vercel deploy --prod \
            --token=$VERCEL_TOKEN \
            --yes \
            --name=z-agency-website 2>&1)
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "$DEPLOY_URL" > deploy-url.txt
          echo "✅ DEPLOYED: $DEPLOY_URL"
          
      - name: Upload URL artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-url
          path: deploy-url.txt
          retention-days: 7
          
      - name: Summary
        run: |
          echo "## ✅ Deployed!" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: $DEPLOY_URL" >> $GITHUB_STEP_SUMMARY
